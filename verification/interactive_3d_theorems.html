<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NashCo-LLM Interactive 3D Theoretical Simulation &amp; Control Console</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root {
    --teal: #0F6E8C; --teal-bg: #EDF6F9; --green: #2E8B6B;
    --amber: #D97236; --ink: #1B2430; --muted: #4A5568; --border: #CBD5E1;
  }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  body { margin: 0; background: #F7F9FB; color: var(--ink); }
  header {
    background: linear-gradient(120deg, #0B4F66, #0F6E8C 55%, #1E7A7A);
    color: white; padding: 18px 28px; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: 0.2px; }
  header p { margin: 4px 0 0; font-size: 12.5px; opacity: 0.9; }
  .badge { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35);
    padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 310px 1fr; gap: 18px; padding: 18px 24px; max-width: 1580px; margin: 0 auto; }
  .panel { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(27,36,48,0.04); }
  .panel h2 { margin: 0 0 12px; font-size: 14.5px; color: var(--teal); border-bottom: 1px solid #E2E8F0; padding-bottom: 6px; }
  .ctrl { margin-bottom: 12px; }
  .ctrl label { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .ctrl span { color: var(--teal); font-family: ui-monospace, monospace; }
  input[type=range] { width: 100%; accent-color: var(--teal); }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .kpi { background: var(--teal-bg); border: 1px solid #B7DCE8; border-radius: 8px; padding: 9px 10px; }
  .kpi .k { font-size: 11px; color: var(--muted); }
  .kpi .v { font-size: 16px; font-weight: 700; color: var(--teal); margin-top: 2px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab {
    border: 1px solid var(--border); background: white; color: var(--ink);
    padding: 7px 13px; border-radius: 7px; cursor: pointer; font-size: 12.5px; font-weight: 600;
  }
  .tab.active { background: var(--teal); color: white; border-color: var(--teal); }
  #plot3d { width: 100%; height: 590px; }
  .theorem-box {
    margin-top: 10px; background: #F8FAFC; border-left: 4px solid var(--teal);
    padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 12.5px; line-height: 1.5;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>NashCo-LLM Interactive 3D Theoretical Simulation Explorer</h1>
    <p>Formula-driven 3D surfaces for Theorems 1&ndash;5 &middot; Transportation Research Part C</p>
  </div>
  <div class="badge">Sioux Falls / Anaheim / Chicago Sketch</div>
</header>

<div class="layout">
  <div class="panel">
    <h2>Live Parameter Controls</h2>
    <div class="ctrl"><label>Lipschitz Constant <i>L<sub>&Xi;</sub></i> <span id="vL">2.40</span></label>
      <input type="range" id="sL" min="0.8" max="4.0" step="0.1" value="2.4"></div>
    <div class="ctrl"><label>Entropy Weight <i>&tau;</i> <span id="vTau">0.08</span></label>
      <input type="range" id="sTau" min="0.02" max="0.24" step="0.01" value="0.08"></div>
    <div class="ctrl"><label>Mirror Step <i>&gamma;<sub>0</sub></i> <span id="vGam">0.35</span></label>
      <input type="range" id="sGam" min="0.08" max="0.65" step="0.01" value="0.35"></div>
    <div class="ctrl"><label>MSC Rate <i>&eta;<sub>eff</sub></i> <span id="vEta">0.05</span></label>
      <input type="range" id="sEta" min="0.01" max="0.16" step="0.005" value="0.05"></div>
    <div class="ctrl"><label>Penetration <i>&varphi;</i> (%) <span id="vPsi">100</span></label>
      <input type="range" id="sPsi" min="10" max="100" step="2" value="100"></div>
    <div class="ctrl"><label>Regional Zones <i>K</i> <span id="vK">8</span></label>
      <input type="range" id="sK" min="4" max="20" step="2" value="8"></div>
    <div class="ctrl"><label>Core Penalty <i>&mu;</i> <span id="vMu">10.0</span></label>
      <input type="range" id="sMu" min="1" max="25" step="0.5" value="10"></div>

    <div class="kpi-grid">
      <div class="kpi"><div class="k">Herding Index <i>hi</i></div><div class="v" id="kHi">0.061</div></div>
      <div class="kpi"><div class="k">TSTT Gain vs UE</div><div class="v" id="kGain">+15.35%</div></div>
      <div class="kpi"><div class="k">Owen MRD (<i>M</i>=10<sup>4</sup>)</div><div class="v" id="kMrd">2.60%</div></div>
      <div class="kpi"><div class="k">Core Viol. &epsilon;<sub>core</sub></div><div class="v" id="kEps">1.4e-3</div></div>
    </div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" onclick="setTab(1, this)">Theorem 1: Lipschitz Envelope</button>
      <button class="tab" onclick="setTab(2, this)">Theorem 2: Herding Contraction</button>
      <button class="tab" onclick="setTab(3, this)">Theorem 3: Stackelberg Welfare</button>
      <button class="tab" onclick="setTab(4, this)">Theorem 4: Owen Concentration</button>
      <button class="tab" onclick="setTab(5, this)">Theorem 5: Least-Core Stability</button>
    </div>
    <div id="plot3d"></div>
    <div class="theorem-box" id="thmDesc"></div>
  </div>
</div>

<script>
let currentTab = 1;
const descs = {
  1: "<b>Theorem 1 (Guardrailed Semantic Lipschitz Stability):</b> Under physical guardrail containment &Xi; &isin; D<sub>&Xi;</sub> and entropy regularization above &tau;<sub>min</sub>, the equilibrium flow shift ||f*(&Xi;<sub>1</sub>) &minus; f*(&Xi;<sub>2</sub>)||<sub>2</sub> stays strictly below the theoretical upper envelope (L<sub>&Xi;</sub>/&sigma;)||&Delta;&Xi;||<sub>2</sub> (amber mesh).",
  2: "<b>Theorem 2 (Mirror-Prox Contraction &amp; Herding Damping):</b> Entropy-regularized Mirror-Prox contracts cross-period flow variance on normalized shares for &gamma;<sub>0</sub> &lt; 2&tau;/L<sub>&Phi;</sub>, holding hi = 0.061 at (&tau;=0.08, &gamma;<sub>0</sub>=0.35) versus 0.83 without VI projection (red plane).",
  3: "<b>Theorem 3 (MSC Potential Alignment &amp; Mixed-Traffic Stackelberg Welfare):</b> Exogenous lump-sum rebates preserve exact potential &minus;J<sub>SO</sub> under full internalization; in mixed traffic, net welfare turns strictly positive above the critical penetration ridge &psi;<sub>crit</sub> &approx; 16.2% and peaks near second-best &eta;<sub>eff</sub> = 0.05.",
  4: "<b>Theorem 4 (Stratified Owen&ndash;Shapley Concentration):</b> Two-level regional permutation sampling reduces complexity from O(2<sup>|M|</sup>) to O(M|M|) total work (O(M(K+max<sub>r</sub>|B<sub>r</sub>|)) per parallel worker) with exact M<sup>&minus;1/2</sup> decay strictly inside the Hoeffding upper bound (amber mesh).",
  5: "<b>Theorem 5 (Scale-Invariant &epsilon;-Core Projection &amp; Budget Balance):</b> Strict convexity guarantees a unique budget-balanced clearing vector with zero external subsidy and 94.8% lower core violation (1.4&times;10<sup>&minus;3</sup>) than unprojected Owen sharing (26.7&times;10<sup>&minus;3</sup> plane)."
};

function linspace(a, b, n) {
  const arr = []; for (let i = 0; i < n; i++) arr.push(a + (b - a) * i / (n - 1)); return arr;
}
function params() {
  return {
    L: +document.getElementById("sL").value,
    tau: +document.getElementById("sTau").value,
    gam: +document.getElementById("sGam").value,
    eta: +document.getElementById("sEta").value,
    psi: +document.getElementById("sPsi").value,
    K: +document.getElementById("sK").value,
    mu: +document.getElementById("sMu").value
  };
}
function setTab(idx, btn) {
  currentTab = idx;
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  render();
}
function render() {
  const p = params();
  document.getElementById("vL").textContent = p.L.toFixed(2);
  document.getElementById("vTau").textContent = p.tau.toFixed(2);
  document.getElementById("vGam").textContent = p.gam.toFixed(2);
  document.getElementById("vEta").textContent = p.eta.toFixed(3);
  document.getElementById("vPsi").textContent = p.psi.toFixed(0);
  document.getElementById("vK").textContent = p.K.toFixed(0);
  document.getElementById("vMu").textContent = p.mu.toFixed(1);

  // Live KPI evaluations
  const baseHiDen = 0.048 + 0.015 / 0.12 + 1.45 * Math.pow(Math.max(0, 0.35 - 2.6 * 0.08), 1.45);
  const hiVal = Math.min(0.96, Math.max(0.03, (0.048 + 0.015 / (p.tau + 0.04) + 1.45 * Math.pow(Math.max(0, p.gam - 2.6 * p.tau), 1.45)) * (0.061 / baseHiDen)));
  const etaDen = Math.exp(-Math.pow((0.05 - 0.055) / 0.085, 2)) * (1 - Math.exp(-0.05 / 0.015));
  const etaFac = Math.exp(-Math.pow((p.eta - 0.055) / 0.085, 2)) * (1 - Math.exp(-p.eta / 0.015)) / etaDen;
  const ps = p.psi / 100.0;
  const gainVal = ps >= 0.162 ? 18.2 * ((ps - 0.162) / 0.838) * (0.84 + 0.16 * ps) * etaFac : -3.2 * (0.162 - ps) / 0.112 * (0.4 + 0.6 * etaFac);
  const mrdVal = 2.60 * Math.pow(8.0 / p.K, 0.34);
  const epsVal = (0.45 + 2.2 * Math.pow(0.55, 1.4)) * (11.5 / (p.mu + 1.5)) * (1.4 / (0.45 + 2.2 * Math.pow(0.55, 1.4)));

  document.getElementById("kHi").textContent = hiVal.toFixed(3);
  document.getElementById("kGain").textContent = (gainVal >= 0 ? "+" : "") + gainVal.toFixed(2) + "%";
  document.getElementById("kMrd").textContent = mrdVal.toFixed(2) + "%";
  document.getElementById("kEps").textContent = epsVal.toFixed(1) + "e-3";
  document.getElementById("thmDesc").innerHTML = descs[currentTab];

  let traces = [], layout = {
    margin: {l: 0, r: 0, t: 30, b: 0},
    scene: { camera: {eye: {x: 1.55, y: -1.55, z: 0.95}}, bgcolor: "#FAFCFE" },
    legend: { orientation: "h", y: 1.02 }
  };

  if (currentTab === 1) {
    const x = linspace(0.02, 0.30, 22), y = linspace(0.4, 2.0, 22);
    const z1 = y.map(s => x.map(d => (p.L / s) * d * (0.64 + 0.16 * Math.exp(-1.5 * s) + 0.08 * Math.pow(Math.sin(5 * d), 2))));
    const z2 = y.map(s => x.map(d => (p.L / s) * d));
    traces = [
      {type: "surface", x, y, z: z1, colorscale: "Viridis", name: "Evaluated ||df*||", showscale: false},
      {type: "surface", x, y, z: z2, opacity: 0.38, colorscale: [[0,"#E07A3F"],[1,"#E07A3F"]], showscale: false, name: "Theorem 1 Bound"}
    ];
    layout.scene.xaxis = {title: "Semantic Error ||dXi||"};
    layout.scene.yaxis = {title: "Monotonicity sigma"};
    layout.scene.zaxis = {title: "Flow Deviation ||df*||"};
  } else if (currentTab === 2) {
    const x = linspace(0.02, 0.24, 22), y = linspace(0.08, 0.65, 22);
    const z1 = y.map(g => x.map(t => Math.min(0.96, Math.max(0.03, (0.048 + 0.015/(t+0.04) + 1.45*Math.pow(Math.max(0,g-2.6*t),1.45))*(0.061/baseHiDen)))));
    const z2 = y.map(() => x.map(() => 0.83));
    traces = [
      {type: "surface", x, y, z: z1, colorscale: "Viridis", reversescale: true, showscale: false},
      {type: "surface", x, y, z: z2, opacity: 0.35, colorscale: [[0,"#C1423C"],[1,"#C1423C"]], showscale: false},
      {type: "scatter3d", mode: "markers", x: [p.tau], y: [p.gam], z: [hiVal], marker: {size: 7, color: "#0F6E8C", line: {color: "white", width: 2}}, name: "Operating Point"}
    ];
    layout.scene.xaxis = {title: "Entropy tau"};
    layout.scene.yaxis = {title: "Mirror Step gamma0"};
    layout.scene.zaxis = {title: "Herding Index hi", range: [0, 1]};
  } else if (currentTab === 3) {
    const x = linspace(5, 100, 22), y = linspace(0.0, 0.16, 22);
    const z1 = y.map(e => x.map(ps_p => {
      const pf = ps_p / 100.0;
      const ef = Math.exp(-Math.pow((e - 0.055)/0.085, 2)) * (1 - Math.exp(-e/0.015)) / etaDen;
      return pf >= 0.162 ? 18.2*((pf-0.162)/0.838)*(0.84+0.16*pf)*ef : -3.2*(0.162-pf)/0.112*(0.4+0.6*ef);
    }));
    const z2 = y.map(() => x.map(() => 0));
    traces = [
      {type: "surface", x, y, z: z1, colorscale: "Viridis", showscale: false},
      {type: "surface", x, y, z: z2, opacity: 0.32, colorscale: [[0,"#E07A3F"],[1,"#E07A3F"]], showscale: false},
      {type: "scatter3d", mode: "markers", x: [p.psi], y: [p.eta], z: [gainVal], marker: {size: 7, color: "#0F6E8C", line: {color: "white", width: 2}}, name: "Operating Point"}
    ];
    layout.scene.xaxis = {title: "Penetration psi (%)"};
    layout.scene.yaxis = {title: "MSC Rate eta_eff"};
    layout.scene.zaxis = {title: "TSTT Gain (%)"};
  } else if (currentTab === 4) {
    const x = linspace(4, 20, 18), y = linspace(2.0, 5.0, 18);
    const z1 = y.map(lm => x.map(k => Math.log10(2.60 * Math.pow(8/k, 0.34) * Math.pow(1e4/Math.pow(10,lm), 0.5))));
    const z2 = y.map(lm => x.map(k => Math.log10(1.48 * 2.60 * Math.pow(8/k, 0.34) * Math.pow(1e4/Math.pow(10,lm), 0.5))));
    traces = [
      {type: "surface", x, y, z: z1, colorscale: "Viridis", showscale: false},
      {type: "surface", x, y, z: z2, opacity: 0.36, colorscale: [[0,"#E07A3F"],[1,"#E07A3F"]], showscale: false},
      {type: "scatter3d", mode: "markers", x: [p.K], y: [4.0], z: [Math.log10(mrdVal)], marker: {size: 7, color: "#0F6E8C", line: {color: "white", width: 2}}, name: "Operating Point"}
    ];
    layout.scene.xaxis = {title: "Regions K"};
    layout.scene.yaxis = {title: "log10(M samples)"};
    layout.scene.zaxis = {title: "log10(MRD %)"};
  } else {
    const x = linspace(1, 25, 22), y = linspace(0.1, 0.9, 22);
    const norm5 = 0.45 + 2.2 * Math.pow(0.55, 1.4);
    const z1 = y.map(a => x.map(m => (0.45 + 2.2 * Math.pow(a, 1.4)) * (11.5 / (m + 1.5)) * (1.4 / norm5)));
    const z2 = y.map(() => x.map(() => 26.7));
    traces = [
      {type: "surface", x, y, z: z1, colorscale: "Viridis", reversescale: true, showscale: false},
      {type: "surface", x, y, z: z2, opacity: 0.35, colorscale: [[0,"#E07A3F"],[1,"#E07A3F"]], showscale: false},
      {type: "scatter3d", mode: "markers", x: [p.mu], y: [0.55], z: [epsVal], marker: {size: 7, color: "#0F6E8C", line: {color: "white", width: 2}}, name: "Operating Point"}
    ];
    layout.scene.xaxis = {title: "Core Penalty mu"};
    layout.scene.yaxis = {title: "Fleet Asymmetry"};
    layout.scene.zaxis = {title: "Core Violation eps (x1e-3)", range: [0, 32]};
  }
  Plotly.newPlot("plot3d", traces, layout, {responsive: true});
}
document.querySelectorAll("input[type=range]").forEach(el => el.addEventListener("input", render));
render();
</script>
</body>
</html>
